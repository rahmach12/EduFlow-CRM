name: EduFlow DevOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, pdo_mysql, zip, gd, bcmath
        
    - name: Cache Composer packages
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Copy .env
      run: cp ../.env.example .env

    - name: Generate key
      run: php artisan key:generate

    - name: Run Tests
      continue-on-error: true
      run: php artisan test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        
    - name: Install Dependencies
      run: npm ci || npm install
        
    - name: Build Frontend
      run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-build]
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker Compose Stack
      run: docker-compose build

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy Frontend to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: |
        npm i -g vercel
        cd frontend
        echo "Deploying to Vercel... (Simulation - Production secrets needed)"
        # vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        # vercel build --prod --token=$VERCEL_TOKEN
        # vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        
    - name: Deploy Backend to Railway
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        npm i -g @railway/cli
        cd backend
        echo "Deploying to Railway... (Simulation - Production secrets needed)"
        # railway up --detach
